name: Deploy dashboard to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate calculations and backup format
        run: node --test tests/core.test.cjs
      - name: Package only public app assets
        run: |
          mkdir -p _site/vendor
          cp index.html styles.css core.js app.js favicon.svg _site/
          cp vendor/xlsx.full.min.js vendor/LICENSE.sheetjs _site/vendor/
          touch _site/.nojekyll
          node -e "const fs = require('node:fs'); const crypto = require('node:crypto'); let html = fs.readFileSync('_site/index.html', 'utf8'); for (const file of ['styles.css', 'core.js', 'app.js', 'vendor/xlsx.full.min.js']) { const hash = crypto.createHash('sha256').update(fs.readFileSync('_site/' + file)).digest('hex').slice(0, 12); html = html.replace('./' + file, './' + file + '?v=' + hash); } fs.writeFileSync('_site/index.html', html);"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
